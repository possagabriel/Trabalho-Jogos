[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "incarnate"
version = "1.5.0"
description = "INCARNATE — Entre na Fenda"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "pygame-ce>=2.5.0",
]

[project.optional-dependencies]
gpu = [
    "PyOpenGL>=3.1.7",
]
windows = [
    "pyinstaller>=6.0",
]
desktop = [
    "PyOpenGL>=3.1.7",
    "pyinstaller>=6.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.10",
]

[project.scripts]
incarnate = "src.core.application:main"
void-shift = "src.core.application:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src.runtime.story" = ["*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["build", "dist", "*.egg-info", ".eggs"]

[tool.ruff.lint]
select = ["C901", "E", "F", "I", "W"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Funções acima do limite 12 já existentes; não ampliar esta lista.
"game/phase_select.py" = ["C901"]
"src/domain/entities/enemies/base.py" = ["C901"]
"src/domain/systems/combat.py" = ["C901"]
"src/domain/systems/profile_service.py" = ["C901"]
"src/infrastructure/input/input_manager.py" = ["C901"]
"src/infrastructure/ui/hud.py" = ["C901"]
"src/presentation/screens/pause_screen.py" = ["C901"]
"src/presentation/screens/shop_screen.py" = ["C901"]
"src/runtime/application/core.py" = ["C901"]
"src/runtime/controllers/combat.py" = ["C901"]
"src/runtime/controllers/cutscene.py" = ["C901"]
"src/runtime/controllers/loop.py" = ["C901"]
"src/runtime/controllers/pause.py" = ["C901"]
"src/runtime/domain/entities/bosses.py" = ["C901"]
"src/runtime/domain/entities/enemies.py" = ["C901"]
"src/runtime/domain/entities/player.py" = ["C901"]
"src/runtime/domain/world/scenarios.py" = ["C901"]
"src/runtime/presentation/hud.py" = ["C901"]
"src/runtime/presentation/menu.py" = ["C901"]
"src/runtime/presentation/screens/profile_screen.py" = ["C901"]
"src/runtime/presentation/screens/settings_screen.py" = ["C901"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "gpu: requer um contexto OpenGL real e driver de video",
]

[tool.mypy]
python_version = "3.10"
files = ["src/core/application.py", "src/runtime/controllers"]
follow_imports = "skip"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
