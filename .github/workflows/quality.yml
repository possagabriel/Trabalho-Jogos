name: Qualidade

on:
  push:
  pull_request:

jobs:
  analise-estatica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Ruff nos módulos já verificados pelo CI
        run: >-
          python -m ruff check
          main.py
          src/core/application.py
          src/runtime/application/timing.py
          src/runtime/diagnostics/frame_metrics.py
          src/runtime/domain/spatial.py
          src/runtime/presentation/equipment_overlay.py
          src/shared/persistence.py
          src/shared/user_data.py
          src/infrastructure/graphics/renderer.py
          tools/build_desktop.py
          tools/benchmark_runtime.py
          tests/test_application_entrypoint.py
          tests/test_cross_platform.py
          tests/test_runtime_module_layout.py
          tests/test_spatial_index.py
          tests/test_timing_metrics.py
      - name: Ruff em todos os arquivos Python alterados
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="origin/$BASE_REF"
          elif [[ "$REF_NAME" == "main" ]]; then
            base="$BEFORE_SHA"
          else
            base="origin/main"
          fi
          git diff --name-only -z --diff-filter=ACMRT "$base"...HEAD -- '*.py' > /tmp/changed-python
          if [[ -s /tmp/changed-python ]]; then
            mapfile -d '' files < /tmp/changed-python
            python -m ruff check "${files[@]}"
          fi
      - run: python -m mypy

  testes-desktop:
    name: Testes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Executar testes e medir cobertura
        run: >-
          python -m pytest tests/ -q
          --cov=src
          --cov-fail-under=45
          --cov-report=term
          --cov-report=xml
      - name: Verificar orçamento de desempenho
        run: python -m tools.benchmark_runtime --check
      - name: Publicar relatório de cobertura
        uses: actions/upload-artifact@v6
        with:
          name: cobertura-${{ matrix.os }}
          path: coverage.xml
          if-no-files-found: error

  shader-opengl:
    name: Shader OpenGL (Mesa)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar contexto OpenGL virtual
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
      - run: python -m pip install -e ".[dev,gpu]"
      - name: Compilar e renderizar o shader real
        env:
          RUN_GPU_TESTS: "1"
          SDL_VIDEODRIVER: x11
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a python -m pytest tests/test_gpu_shader_integration.py -q
