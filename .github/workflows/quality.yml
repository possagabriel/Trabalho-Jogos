name: Qualidade

on:
  push:
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src/core/application.py tests/test_application_entrypoint.py tests/test_runtime_module_layout.py
      - run: python -m mypy
      - run: python -m pytest tests/ -q
