name: Executáveis Desktop

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  empacotar-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instalar dependências de empacotamento
        run: python -m pip install --upgrade pip ".[desktop]"
      - name: Definir versão do instalador
        id: versao
        shell: pwsh
        env:
          GIT_REF_NAME: ${{ github.ref_name }}
          GIT_REF_TYPE: ${{ github.ref_type }}
        run: |
          $versaoProjeto = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          $versao = if ($env:GIT_REF_TYPE -eq "tag") {
            $env:GIT_REF_NAME -replace '^v', ''
          } else {
            $versaoProjeto
          }
          if ($versao -notmatch '^\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$') {
            throw "Versão inválida para o instalador: $versao"
          }
          "valor=$versao" >> $env:GITHUB_OUTPUT
          $versaoInfo = ($versao -replace '[-+].*$', '')
          "info=$versaoInfo" >> $env:GITHUB_OUTPUT
          Write-Host "Versão do instalador: $versao"
      - name: Criar executável
        run: python tools/build_desktop.py
      - name: Validar inicialização do executável
        shell: pwsh
        run: |
          & .\dist\INCARNATE.exe --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assinar executável quando houver certificado
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_BASE64) {
            Write-Host "Certificado não configurado; artefato será publicado sem assinatura."
            exit 0
          }
          $certificate = Join-Path $env:RUNNER_TEMP "incarnate.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $certificate /p $env:WINDOWS_CERTIFICATE_PASSWORD dist/INCARNATE.exe
      - name: Criar instalador Windows
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.versao.outputs.valor }}
          APP_VERSION_INFO: ${{ steps.versao.outputs.info }}
        run: |
          choco install innosetup --no-progress --yes
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:APP_VERSION" "/DAppVersionInfo=$env:APP_VERSION_INFO" installer\incarnate.iss
      - name: Assinar instalador quando houver certificado
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_BASE64) {
            Write-Host "Certificado não configurado; artefato será publicado sem assinatura."
            exit 0
          }
          $certificate = Join-Path $env:RUNNER_TEMP "incarnate.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $certificate /p $env:WINDOWS_CERTIFICATE_PASSWORD dist/INCARNATE-Setup.exe
      - name: Registrar commit do build
        shell: pwsh
        run: Set-Content -Encoding ascii dist/BUILD-COMMIT-Windows.txt "${{ github.sha }}"
      - name: Validar arquivos de distribuição
        shell: pwsh
        run: |
          $arquivos = @("dist/INCARNATE.exe", "dist/INCARNATE-Setup.exe")
          foreach ($arquivo in $arquivos) {
            if (-not (Test-Path $arquivo -PathType Leaf)) {
              throw "Arquivo esperado não foi criado: $arquivo"
            }
            if ((Get-Item $arquivo).Length -eq 0) {
              throw "Arquivo gerado está vazio: $arquivo"
            }
          }
      - name: Gerar somas SHA-256
        shell: pwsh
        run: |
          Get-FileHash dist/INCARNATE.exe, dist/INCARNATE-Setup.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash) *$($_.Path | Split-Path -Leaf)" } |
            Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - name: Publicar executável baixável
        uses: actions/upload-artifact@v7
        with:
          name: INCARNATE-Windows
          path: |
            dist/INCARNATE.exe
            dist/INCARNATE-Setup.exe
            dist/BUILD-COMMIT-Windows.txt
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publicar executável na Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          files: |
            dist/INCARNATE.exe
            dist/INCARNATE-Setup.exe
            dist/BUILD-COMMIT-Windows.txt
            dist/SHA256SUMS.txt

  empacotar-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar dependências de empacotamento
        run: python -m pip install --upgrade pip ".[desktop]"
      - name: Criar executável
        run: python tools/build_desktop.py
      - name: Validar inicialização do executável
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ./dist/INCARNATE/INCARNATE --smoke-test
      - name: Empacotar e registrar commit do build
        run: |
          chmod +x dist/INCARNATE/INCARNATE
          mkdir -p dist/INCARNATE/licenses
          cp data/fonts/OFL.txt dist/INCARNATE/licenses/OFL.txt
          grep -q "Orbitron Project Authors" dist/INCARNATE/licenses/OFL.txt
          grep -q "Indian Type Foundry" dist/INCARNATE/licenses/OFL.txt
          grep -q "SIL OPEN FONT LICENSE Version 1.1" dist/INCARNATE/licenses/OFL.txt
          echo "${{ github.sha }}" > dist/BUILD-COMMIT-Linux.txt
          tar -czf dist/INCARNATE-Linux-x86_64.tar.gz -C dist INCARNATE
          cd dist
          sha256sum INCARNATE-Linux-x86_64.tar.gz > SHA256SUMS-Linux.txt
      - name: Publicar executável baixável
        uses: actions/upload-artifact@v6
        with:
          name: INCARNATE-Linux-x86_64
          path: |
            dist/INCARNATE-Linux-x86_64.tar.gz
            dist/BUILD-COMMIT-Linux.txt
            dist/SHA256SUMS-Linux.txt
          if-no-files-found: error
      - name: Publicar executável na Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          files: |
            dist/INCARNATE-Linux-x86_64.tar.gz
            dist/BUILD-COMMIT-Linux.txt
            dist/SHA256SUMS-Linux.txt
